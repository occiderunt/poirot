[package]
name = "poirot"
version = "1.0.1"
description = "A rustic food inventory tracker"
authors = ["occiderunt"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "poirot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
